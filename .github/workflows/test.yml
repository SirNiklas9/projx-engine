name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lifecycle:
    name: lifecycle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Check out local-replace dependencies
        shell: bash
        env:
          GH_CLONE_TOKEN: ${{ secrets.PROJX_RELEASE_TOKEN != '' && secrets.PROJX_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/.."
          clone_repo() {
            [ -d "$1/.git" ] || git clone --depth 1 "https://x-access-token:${GH_CLONE_TOKEN}@github.com/$2/$1.git" "$1"
          }
          clone_repo Pulp BananaLabs-OSS
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run lifecycle and provider acceptance tests
        shell: bash
        run: >-
          go test . -count=1 -run
          'Test(HandleHookLifecycle|MergeGlobalHookIdempotent|AgentRunInvokesCodexAdapterWithSelectedProfile|DispatchJobKillsManagedDescendantsOnExit|TerminateManagedTreeKillsSupervisorAndChild|ManagedChildEnvReplacesParentLease)'
      - name: Run deterministic routing/catalog tests
        shell: bash
        run: go test ./internal/routing -count=1
      - name: Run full suite on Linux
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: go test ./... -count=1
